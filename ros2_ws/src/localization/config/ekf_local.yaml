ekf_odom:
  ros__parameters:
    frequency: 10.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint   # CHANGED (was base_link), only if it is the URDF root
    world_frame: odom

    odom0: /wheel/odom
    odom0_config: [false, false, false,   # x y z
                   false, false, false,   # roll pitch yaw
                   true,  false, false,   # vx vy vz
                   false, false, false,   # vroll vpitch vyaw
                   false, false, false]   # ax ay az
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,     # yaw (absolute)
                  false, false, false,
                  false, false, true,     # yaw rate
                  false, false, false]
    imu0_remove_gravitational_acceleration: true