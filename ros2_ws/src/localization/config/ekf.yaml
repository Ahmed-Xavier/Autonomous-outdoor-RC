ekf_odom:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odom
    odom0_config: [false, false, false,   # x y z
                   false, false, false,   # roll pitch yaw
                   true,  false, false,   # vx vy vz
                   false, false, false,   # vroll vpitch vyaw
                   false, false, false]   # ax ay az
    imu0: /esp32/imu
    imu0_config: [false, false, false,
                  false, false, true,     # yaw (absolute, from BNO055)
                  false, false, false,
                  false, false, true,     # yaw rate
                  false, false, false]
    imu0_remove_gravitational_acceleration: true

ekf_map:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    imu0: /esp32/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

navsat_transform:
  ros__parameters:
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0   # set for your location
    yaw_offset: 0.0                     # 0 if IMU yaw=0 faces East (ENU)
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: false
    wait_for_datum: false