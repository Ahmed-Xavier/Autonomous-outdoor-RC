waypoint_manager:
  ros__parameters:
    tol: 3.0
    # Normalized motor command; nonzero values are raised to at least motor_min_pwm (100), so it is NOT gentle.
    speed: 0.3
    steer_sign: 1.0
    k_steer: 1.5
    max_steer: 0.7
    yaw_offset_deg: 0.0
    gps_timeout: 2.0
    loop_period: 0.1
    from_ll_service: /fromLL
    to_ll_service: /navsat_transform/toLL
    markers_topic: /waypoints/markers
    waypoint_marker_scale: 0.35
    target_marker_scale: 0.55
    text_height: 0.5
    line_width: 0.08
    guidance_topic: /waypoints/guidance
